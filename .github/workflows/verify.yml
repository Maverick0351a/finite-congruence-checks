name: Reproduce and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check recorded evidence against source
        run: python scripts/check_evidence.py
      - name: Reproduce the entire bounded experiment
        run: python run_experiment.py --out runs/ci
      - name: Check mathematical agreement with recorded evidence
        run: python scripts/check_evidence.py --evidence runs/ci --compare evidence
      - name: Independently audit every small representable congruence family
        run: python scripts/audit_operation_minima.py --out runs/operation-audit.json
      - name: Check chart data and offline gallery freshness
        run: python scripts/build_charts.py --check
      - name: Check Lean table correspondence
        run: python lean/check_data.py
      - name: Check Lean export freshness and failure controls
        run: |
          python lean/export_data.py --check
          python -m unittest discover -s lean -p 'test_*.py' -v
      - name: Check grouping reference, schema, and recorded claim controls
        run: python -m unittest discover -s scripts -p 'test_grouping*.py' -v
      - name: Replay and check explorer data
        run: python scripts/build_space_data.py --check
      - name: Check browser relation logic against verified certificates
        run: node scripts/check_space.cjs
      - name: Rebuild and independently verify the representation atlas
        run: |
          python scripts/build_atlas_data.py --check
          python scripts/check_atlas.py --out runs/atlas-review.json --check-receipt evidence/atlas-review.json
          python scripts/query_atlas.py build-claims --check
          python -m unittest discover -s scripts -p 'test_atlas*.py' -v
          node scripts/check_atlas_ui.cjs
          node scripts/check_atlas_map.cjs
      - name: Preserve reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: runs/
          retention-days: 14

  lean:
    name: Concrete Lean certificates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          leanchecker: 'true'

  grouping-checker:
    name: Generic grouping checker and native agreement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          leanchecker: 'false'
      - name: Prove and exhaustively compare the exact native build
        run: python scripts/run_grouping_checks.py --out runs/grouping-checker
      - name: Propose, reject with witness, repair, and recheck
        run: python scripts/grouping_tool.py demo --receipt runs/grouping-checker/summary.json --out runs/grouping-checker/demo.json
      - name: Check reference and evidence rejection controls
        env:
          GROUPING_RECEIPT: runs/grouping-checker/summary.json
        run: python -m unittest discover -s scripts -p 'test_grouping*.py' -v
      - name: Preserve native build and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grouping-checker
          path: |
            runs/grouping-checker/summary.json
            runs/grouping-checker/demo.json
            runs/grouping-checker/binary.gz
            runs/grouping-checker/native.jsonl.gz
            runs/grouping-checker/logs/
            runs/grouping-checker/build-traces/
            runs/grouping-checker/wrapper-mutation/
          retention-days: 90

  upstream-bridge:
    name: Upstream N5/B3 witness bridge
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean/upstream
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          leanchecker: 'false'
      - name: Reproduce the complete concrete witness bridge
        run: python lean/run_checks.py --out runs/formal-bridge
      - name: Preserve formal verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formal-bridge
          path: runs/formal-bridge/
          retention-days: 14
