name: Reproduce and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Verify immutable proof-demo links against their Git blobs.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check recorded evidence against source
        run: python scripts/check_evidence.py
      - name: Reproduce the entire bounded experiment
        run: python run_experiment.py --out runs/ci
      - name: Check mathematical agreement with recorded evidence
        run: python scripts/check_evidence.py --evidence runs/ci --compare evidence
      - name: Independently audit every small representable congruence family
        run: python scripts/audit_operation_minima.py --out runs/operation-audit.json
      - name: Check chart data and offline gallery freshness
        run: python scripts/build_charts.py --check
      - name: Check Lean table correspondence
        run: python lean/check_data.py
      - name: Check Lean export freshness and failure controls
        run: |
          python lean/export_data.py --check
          python -m unittest discover -s lean -p 'test_*.py' -v
      - name: Check grouping reference, schema, and recorded claim controls
        run: python -m unittest discover -s scripts -p 'test_grouping*.py' -v
      - name: Check TM domains, bounds, and configuration evidence controls
        run: |
          python -m unittest discover -s scripts -p 'test_tm*.py' -v
          python scripts/run_tm_checks.py replay --out evidence/tm-port-v1
      - name: Check constrained repair dataset and feedback controls
        run: |
          python scripts/repair_tasks.py --check
          python -m unittest discover -s scripts -p 'test_repair*.py' -v
          python scripts/run_repair_benchmark.py replay evidence/repair-pilot-v1
      - name: Replay and check explorer data
        run: python scripts/build_space_data.py --check
      - name: Check browser relation logic against verified certificates
        run: node scripts/check_space.cjs
      - name: Rebuild and independently verify the representation atlas
        run: |
          python scripts/build_atlas_data.py --check
          python scripts/check_atlas.py --out runs/atlas-review.json --check-receipt evidence/atlas-review.json
          python scripts/query_atlas.py build-claims --check
          python scripts/query_atlas.py build-tm --check
          python -m unittest discover -s scripts -p 'test_atlas*.py' -v
          node scripts/check_atlas_ui.cjs
          node scripts/check_atlas_map.cjs
          node scripts/check_tm_atlas_ui.cjs
          python scripts/check_tm_retrieval.py evidence/tm-retrieval-v1/answers.json
      - name: Check N5 and Turing source context bindings
        run: |
          python scripts/build_n5_context.py --check
          python -m unittest discover -s scripts -p 'test_n5_context.py' -v
          python -m unittest discover -s scripts -p 'test_context_query.py' -v
          python -m unittest discover -s scripts -p 'test_context_tm.py' -v
          python -m unittest discover -s scripts -p 'test_n5_transfer.py' -v
          python -m unittest discover -s scripts -p 'test_n5_reverse_transfer.py' -v
          python scripts/build_n5_reuse.py --check
          python -m unittest discover -s scripts -p 'test_n5_reuse.py' -v
          node scripts/check_n5_context.cjs
          node scripts/check_n5_reuse.cjs
      - name: Check exact five-object families and recorded proof bindings
        run: |
          python scripts/check_five_object.py replay
          python scripts/five_object_proof.py replay
          python scripts/build_five_object_chart.py --check
          python lean/five_object/generate_certificates.py --check
          python -m unittest discover -s scripts -p 'test_five_object*.py' -v
      - name: Check exact Snaky certificate and recorded finite-board binding
        run: |
          python scripts/check_snaky.py replay
          python scripts/snaky_proof.py replay
          python scripts/build_snaky_chart.py --check
          python lean/snaky/generate_finite_cards.py --check
          python scripts/build_snaky_play.py --check
          python scripts/check_snaky_play.py
          python scripts/build_snaky_presentation.py --check
          python -m unittest discover -s scripts -p 'test_snaky*.py' -v
          node scripts/check_snaky_play_ui.cjs
      - name: Preserve reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: runs/
          retention-days: 14

  lean:
    name: Concrete Lean certificates
    runs-on: ubuntu-latest
    timeout-minutes: 210 # Build 60m + kernel 120m + setup, controls, other proofs and artifact upload.
    env:
      LEAN_NUM_THREADS: '1'
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          leanchecker: 'true'
      - name: Prove exact five-object minima and reject mismatched evidence
        run: |
          python scripts/five_object_proof.py run --out runs/five-object-proof
          python scripts/five_object_proof.py replay --out runs/five-object-proof
      - name: Preserve five-object proof and binding evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: five-object-proof
          path: runs/five-object-proof/
          retention-days: 90
      - name: Prove Snaky on both finite boards and reject mismatched claims
        run: |
          mkdir -p runs
          { nproc; free -h; df -h .; } | tee runs/snaky-host-resources.txt
          /usr/bin/time -v -o runs/snaky-host-timing.txt python scripts/snaky_proof.py run --out runs/snaky-proof
          python scripts/snaky_proof.py replay --out runs/snaky-proof
      - name: Preserve Snaky finite-board proof and binding evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snaky-finite-proof
          path: |
            runs/snaky-proof/
            runs/snaky-host-resources.txt
            runs/snaky-host-timing.txt
          retention-days: 90

  grouping-checker:
    name: Generic grouping checker and native agreement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          leanchecker: 'false'
      - name: Prove and exhaustively compare the exact native build
        run: python scripts/run_grouping_checks.py --out runs/grouping-checker
      - name: Propose, reject with witness, repair, and recheck
        run: python scripts/grouping_tool.py demo --receipt runs/grouping-checker/summary.json --out runs/grouping-checker/demo.json
      - name: Check reference and evidence rejection controls
        env:
          GROUPING_RECEIPT: runs/grouping-checker/summary.json
        run: python -m unittest discover -s scripts -p 'test_grouping*.py' -v
      - name: Preserve native build and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grouping-checker
          path: |
            runs/grouping-checker/summary.json
            runs/grouping-checker/demo.json
            runs/grouping-checker/binary.gz
            runs/grouping-checker/native.jsonl.gz
            runs/grouping-checker/logs/
            runs/grouping-checker/build-traces/
            runs/grouping-checker/wrapper-mutation/
          retention-days: 90

  tm-translation:
    name: Pinned TM configuration agreement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean/tm
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          leanchecker: 'false'
      - name: Check exact source extraction
        run: python lean/tm/check_source.py
      - name: Restore pinned Lean dependencies
        working-directory: lean/tm
        run: |
          lake exe cache get Mathlib.Logic.Function.Iterate Mathlib.Data.Int.Basic
      - name: Compare state, head, and finite-support tape
        run: |
          python scripts/run_tm_checks.py run --out runs/tm-checks
          python scripts/run_tm_checks.py replay --out runs/tm-checks
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tm-translation
          path: |
            runs/tm-checks/
            lean/tm/.lake/build/bin/tmOracle
          retention-days: 90

  tm-pair-proof:
    name: Exact TM pair proof and atlas binding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean/tm-pair
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          leanchecker: 'false'
      - name: Prove the exact pair and reject mismatched bindings
        run: python scripts/tm_pair_proof.py run --out runs/tm-pair-proof
      - name: Replay the new proof record
        run: python scripts/tm_pair_proof.py replay --out runs/tm-pair-proof
      - name: Preserve proof, axiom audit, and deliberate-error evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tm-pair-proof
          path: runs/tm-pair-proof/
          retention-days: 90

  n5-renaming:
    name: N5 renaming proof and atlas binding
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean/renaming
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          leanchecker: 'false'
      - name: Prove the transfer and reject inconsistent renamings
        run: python scripts/n5_transfer.py run --out runs/n5-renaming
      - name: Replay the new proof record
        run: python scripts/n5_transfer.py replay --out runs/n5-renaming
      - name: Prove the reverse-label transfer and reject mismatched bindings
        run: python scripts/n5_reverse_transfer.py run --out runs/n5-reverse-labels
      - name: Replay the reverse-label proof record
        run: python scripts/n5_reverse_transfer.py replay --out runs/n5-reverse-labels
      - name: Preserve proof and binding evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: n5-renaming-proof
          path: |
            runs/n5-renaming/
            runs/n5-reverse-labels/
          retention-days: 90

  upstream-bridge:
    name: Upstream N5/B3 witness bridge
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean/upstream
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          leanchecker: 'false'
      - name: Reproduce the complete concrete witness bridge
        run: python lean/run_checks.py --out runs/formal-bridge
      - name: Preserve formal verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formal-bridge
          path: runs/formal-bridge/
          retention-days: 14
