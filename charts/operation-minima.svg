  <g id="text_37">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(53.46 525.069369)">Each minimum fixes both the carrier and the exact saved congruence relations. Other embeddings and higher arities are excluded.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(53.46 538.546712)">Zero is a valid result: the empty operation signature already realizes the full equivalence lattices C2 and M3.</text>
  </g>
