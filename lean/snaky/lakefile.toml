name = "snakyFinite"
version = "0.1.0"
defaultTargets = ["SnakyFinite", "SnakyBinding"]
moreLeanArgs = ["-j1"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "OAI"
globs = ["OAI.+"]

[[lean_lib]]
name = "FiniteCards"
globs = ["FiniteCards.+"]

[[lean_lib]]
name = "SnakySemantics"

[[lean_lib]]
name = "SnakyFinite"

[[lean_lib]]
name = "SnakyBinding"
